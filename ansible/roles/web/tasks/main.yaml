- name: Instalar Apache, el cliente de MariaDB y el cliente NFS
  ansible.builtin.apt:
    name:
      - apache2
      - mariadb-client
      - nfs-common
    state: present

- name: Quitar PHP del servidor web (ahora lo ejecuta la máquina php)
  ansible.builtin.apt:
    name:
      - "libapache2-mod-php*"
      - php
      - php-mysql
      - php-mbstring
    state: absent
    autoremove: true

- name: Cambiar el MPM de Apache a event (mod_php obligaba a usar prefork)
  community.general.apache2_module:
    name: "{{ item.modulo }}"
    state: "{{ item.estado }}"
    ignore_configcheck: true
  loop:
    - { modulo: mpm_prefork, estado: absent }
    - { modulo: mpm_event, estado: present }
  notify: Reiniciar Apache

- name: Habilitar los módulos de proxy hacia PHP-FPM
  community.general.apache2_module:
    name: "{{ item }}"
    state: present
  loop:
    - proxy
    - proxy_fcgi
  notify: Recargar Apache

- name: Crear el punto de montaje de la aplicación
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory

- name: Montar la aplicación desde el NAS por NFS
  ansible.posix.mount:
    path: "{{ app_dir }}"
    src: "{{ ip_nas_datos }}:{{ nfs_dir }}"
    fstype: nfs
    opts: ro,_netdev
    state: mounted

- name: Configurar el virtual host
  ansible.builtin.template:
    src: vhost.conf.j2
    dest: /etc/apache2/sites-available/guestbook.conf
    mode: "0644"
  notify: Recargar Apache

- name: Habilitar el virtual host
  ansible.builtin.command: a2ensite guestbook.conf
  args:
    creates: /etc/apache2/sites-enabled/guestbook.conf
  notify: Recargar Apache

- name: Deshabilitar el sitio por defecto
  ansible.builtin.command: a2dissite 000-default.conf
  args:
    removes: /etc/apache2/sites-enabled/000-default.conf
  notify: Recargar Apache

- name: Apache arrancado y habilitado
  ansible.builtin.service:
    name: apache2
    state: started
    enabled: true

- name: Habilitar mod_rewrite (lo usa el .htaccess de la aplicación)
  community.general.apache2_module:
    name: rewrite
    state: present
  notify: Recargar Apache
