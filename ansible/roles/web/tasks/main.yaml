- name: Instalar Apache, PHP y el cliente de MariaDB
  ansible.builtin.apt:
    name:
      - apache2
      - libapache2-mod-php
      - php
      - php-mysql
      - mariadb-client
    state: present

- name: Descargar y descomprimir la aplicación
  ansible.builtin.unarchive:
    src: "{{ app_tarball }}"
    dest: /var/www
    remote_src: true
    creates: "{{ app_dir }}/schema.sql"

- name: Generar config.php con los datos de conexión
  ansible.builtin.template:
    src: config.php.j2
    dest: "{{ app_dir }}/config.php"
    owner: root
    group: www-data
    mode: "0640"
