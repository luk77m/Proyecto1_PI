- name: Configuración común
  hosts: all
  become: true
  gather_facts: false
  roles:
    - commons

- name: Servidor de base de datos
  hosts: servidores_bd
  become: true
  roles:
    - bd

- name: Servidor NAS
  hosts: servidores_nas
  become: true
  roles:
    - nas

- name: Servidor PHP-FPM
  hosts: servidores_php
  become: true
  roles:
    - php

- name: Servidor web
  hosts: servidores_web
  become: true
  roles:
    - web

- name: Balanceador HAProxy
  hosts: servidores_lb
  become: true
  roles:
    - haproxy
